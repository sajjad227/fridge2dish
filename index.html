<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثلاجتي الذكية - ابتكر وصفاتك</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b);
            --card-bg: rgba(30, 41, 59, 0.9);
            --primary: #10b981;
            --primary-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .section-title {
            font-size: 1rem;
            color: var(--primary);
            margin: 15px 0 10px 0;
            font-weight: 600;
        }

        .ingredients-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tag:hover {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--primary);
        }

        .tag.selected {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 25px;
            outline: none;
            cursor: pointer;
        }

        select option {
            background: #1e293b;
            color: var(--text-main);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-reset {
            background: var(--danger);
            color: #fff;
        }

        .btn-reset:hover {
            background: var(--danger-hover);
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .result-box h3 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .result-box p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>ثلاجتي الذكية 🥗</h1>
            <p>اختر مكوناتك المتاحة، ودع الذكاء يقترح عليك أشهى الوصفات!</p>
        </div>

        <div class="section-title">اختر المكونات السريعة:</div>
        <div class="ingredients-grid" id="tagsContainer">
            <div class="tag" onclick="toggleTag(this)">🍅 طماطم</div>
            <div class="tag" onclick="toggleTag(this)">🧀 جبنة</div>
            <div class="tag" onclick="toggleTag(this)">🥚 بيض</div>
            <div class="tag" onclick="toggleTag(this)">🍗 دجاج</div>
            <div class="tag" onclick="toggleTag(this)">🥔 بطاطس</div>
            <div class="tag" onclick="toggleTag(this)">🍄 فطر</div>
            <div class="tag" onclick="toggleTag(this)">🧄 ثوم وبصل</div>
            <div class="tag" onclick="toggleTag(this)">🥩 لحم مفروم</div>
            <div class="tag" onclick="toggleTag(this)">🫑 فلفل رومي</div>
        </div>

        <div class="section-title">أو اكتب مكونات إضافية:</div>
        <input type="text" id="customIngredients" placeholder="مثال: فلفل، زيت زيتون، بهارات...">

        <div class="section-title">نوع الوجبة المطلوبة:</div>
        <select id="mealType">
            <option value="quick">وجبة سريعة وخفيفة</option>
            <option value="healthy">غداء صحي ومتوازن</option>
            <option value="protein">غنية بالبروتين (عضلات)</option>
            <option value="dinner">عشاء خفيف ولذيذ</option>
        </select>

        <div class="btn-group">
            <button class="btn-primary" onclick="generateRecipe()">🔍 ابتكار وصفة</button>
            <button class="btn-reset" onclick="resetForm()">🔄 إعادة ضبط</button>
        </div>

        <div class="result-box" id="resultBox">
            <h3 id="resultTitle">عنوان الوصفة</h3>
            <p id="resultText">تفاصيل ومكونات الوصفة ستظهر هنا...</p>
        </div>
    </div>

    <script>
        function toggleTag(element) {
            element.classList.toggle('selected');
        }

        function generateRecipe() {
            const selectedTags = Array.from(document.querySelectorAll('.tag.selected')).map(tag => tag.textContent.trim());
            const customInput = document.getElementById('customIngredients').value;
            const mealType = document.getElementById('mealType').value;
            const resultBox = document.getElementById('resultBox');
            const resultTitle = document.getElementById('resultTitle');
            const resultText = document.getElementById('resultText');

            if (selectedTags.length === 0 && !customInput) {
                alert('الرجاء اختيار مكون واحد على الأقل أو كتابة مكوناتك!');
                return;
            }

            let allIngredients = [...selectedTags];
            if (customInput) {
                allIngredients.push(customInput);
            }

            // محاكاة اقتراح وصفة ذكية بناءً على المعطيات
            resultBox.style.display = 'block';
            resultTitle.textContent = `✨ وجبة مقترحة بناءً على اختيارك (${mealType === 'quick' ? 'سريعة وخفيفة' : 'مميزة'})`;
            resultText.innerHTML = `<strong>المكونات المستخدمة:</strong> ${allIngredients.join('، ')}<br><br>` +
                                   `<strong>طريقة التحضير الذكية:</strong><br>` +
                                   `1. قم بتحضير وتجهيز المكونات المذكورة وتطبيخها بطريقة متناسقة.<br>` +
                                   `2. أضف البهارات والملح حسب الرغبة مع القليل من زيت الزيتون.<br>` +
                                   `3. اتركها على نار متوسطة لمدة 10-15 دقيقة حتى تصبح جاهزة للتقديم. بالعافية!`;
        }

        function resetForm() {
            document.querySelectorAll('.tag').forEach(tag => tag.classList.remove('selected'));
            document.getElementById('customIngredients').value = '';
            document.getElementById('mealType').selectedIndex = 0;
            document.getElementById('resultBox').style.display = 'none';
        }
    </script>
</body>
</html>
