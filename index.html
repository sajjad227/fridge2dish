      :root {
            --primary: #1e3d2f;
            --secondary: #2b5340;
            --accent: #438a5e;
            --bg: #f4f7f5;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --border: #d1d8d3;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--secondary);
        }
        .quick-ingredients {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        .tag {
            background: #e2ede5;
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border);
        }
        .tag:hover {
            background: var(--accent);
            color: white;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            resize: none;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: var(--accent);
        }
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 20px;
            background: white;
            outline: none;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-primary {
            background-color: #27ae60;
            color: white;
        }
        .btn-danger {
            background-color: #e74c3c;
            color: white;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #f9fbfa;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: none;
        }
        .result-box h3 {
            color: var(--primary);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🥗 ثلاجتي الذكية</h1>
        
        <label>اختر أو اكتب المكونات المتوفرة لديك:</label>
        <div class="quick-ingredients">
            <span class="tag" onclick="addIngredient('طماطم')">🍅 طماطم</span>
            <span class="tag" onclick="addIngredient('جبنة')">🧀 جبنة</span>
            <span class="tag" onclick="addIngredient('بيض')">🥚 بيض</span>
            <span class="tag" onclick="addIngredient('دجاج')">🍗 دجاج</span>
            <span class="tag" onclick="addIngredient('بطاطس')">🥔 بطاطس</span>
        </div>

        <textarea id="ingredientsInput" placeholder="مثال: طماطم، جبنة، بيض . . ."></textarea>

        <label>نوع الوجبة:</label>
        <select id="mealType">
            <option value="quick">وجبة سريعة وخفيفة</option>
            <option value="lunch">غداء متكامل</option>
            <option value="dinner">عشاء خفيف</option>
        </select>
<div class="btn-group">
<div class="btn-group">
    <button class="btn-primary" onclick="getRecipe()">Get Recipe 🔍</button>
    <button class="btn-danger" onclick="resetForm()">Reset 🔄</button>
</div>

<div id="recipeResult" class="result-box" style="display: none;">
    <h3>الوصّفة المقترحة 🍲</h3>
    <p id="recipeText"></p>
</div>
</div>

<script>
function addIngredient(item) {
    const input = document.getElementById('ingredientsInput');
    if (input.value.trim() === '') {
        input.value = item;
    } else {
        input.value += ', ' + item;
    }
}

function getRecipe() {
    const input = document.getElementById('ingredientsInput');
    const resultBox = document.getElementById('recipeResult');
    const recipeText = document.getElementById('recipeText');

    if (!input.value.trim()) {
        alert('الرجاء اختيار أو كتابة مكون واحد على الأقل !');
        return;
    }

    const text = input.value.toLowerCase();
    let recipe = '';

    if (text.includes('بيض') && text.includes('طماطم')) {
        recipe = '<b>1. شكشوكة سريعة:</b><br>في مقلاة، سخن القليل من الزيت ثم أضف الطماطم المقطعة حتى تنضج وتصبح واضحة. <br><b>2.</b> اشرس البيض فوقها وأجب غير الملح.<br><b>3.</b> اتركها في الثلاث مع القليل من الوقود حتى تصبح ناضجة.';
    } else if (text.includes('دجاج')) {
        recipe = '<b>1. دجاج مشوح:</b><br>قطع الدجاج إلى قطع صغيرة وتبلها بالبهارات.<br><b>2.</b> يجب تجهيزها وغسل الحطات الكافية.<br><b>3.</b> يقلى دجاج مقل مقلي حتى النضج.';
    } else {
        recipe = `<b>الوصفة لـ:</b> ${input.value}<br><b>1.</b> قم بتجهيز كافة المكونات واغسلها جيداً.<br><b>2.</b> اطهي المكونات على نار متوسطة لمدة 10-7 دقائق حتى تداخل وتهادء والشفاء.`;
    }

    resultBox.style.display = 'block';
    recipeText.innerHTML = recipe;
}

function resetForm() {
    document.getElementById('ingredientsInput').value = '';
    document.getElementById('recipeResult').style.display = 'none';
}
</script>
      
</body>
